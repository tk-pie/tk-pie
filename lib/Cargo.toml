[package]
name = "tk-pie"
version = "0.1.0"
authors = ["Joakim Hulthe <joakim@hulthe.net>"]
description = "Tk🥧 keyboard firmware"
edition = "2024"

[dependencies]
bytemuck = { workspace = true, features = ["derive"] }
cortex-m-rt.workspace = true
crc-any.workspace = true
critical-section.workspace = true
embassy-futures.workspace = true
embassy-sync.workspace = true
embassy-time.workspace = true
embedded-hal.workspace = true
futures = { workspace = true, default-features = false, features = ["async-await"] }
glam = { workspace = true, default-features = false, features = ["libm"] }
heapless.workspace = true
libm.workspace = true
log.workspace = true
msgpck = { workspace = true, features = ["alloc"] }
portable-atomic = { workspace = true, default-features = false }
rend = { workspace = true, features = ["bytemuck"], default-features = false }
rtt-target.workspace = true
serde = { workspace = true, default-features = false, features = ["derive", "alloc"] }
static_cell.workspace = true

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
cortex-m.workspace = true
embassy-usb = { workspace = true, default-features = false }
embedded-alloc = { workspace = true, features = ["llff"] }
embedded-io-async.workspace = true
fixed.workspace = true
# once_cell = { workspace = true, default-features = false }
pio-proc.workspace = true
postcard = { workspace = true, features = ["alloc"] }
smart-leds.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
embassy-time = { workspace = true, features = ["std"] }

[target.thumbv6m-none-eabi.dependencies]
embassy-executor = { workspace = true, features = ["platform-cortex-m", "nightly", "executor-thread", "executor-interrupt", "embassy-time-driver"] }
embassy-rp = { workspace = true, features = ["rp2040", "time-driver", "critical-section-impl"] }
embassy-usb = { workspace = true, features = ["usbd-hid"] }
embassy-usb-driver.workspace = true
embassy-usb-logger.workspace = true
usb-device.workspace = true
usbd-hid.workspace = true

[target.'cfg(target_arch = "x86_64")'.dev-dependencies]
embassy-time = { workspace = true, features = ["std", "generic-queue-128"] }
simple_logger.workspace = true

[features]
std = []
default = ["n-key-rollover"]
n-key-rollover=[]
