[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[target.'cfg(target_os = "linux")'.dependencies.tk-pie]
path = "../lib"
package = "tk-pie"
features = ["std"]

[target.'cfg(target_os = "linux")'.dependencies]
clap = { workspace = true, features = ["derive"] }
eframe = { workspace = true, features = ["persistence", "ron", "serde"] }
egui = { workspace = true, features = ["persistence", "ron", "serde"] }
msgpck = { workspace = true, features = ["alloc"] }
eyre.workspace = true
log.workspace = true
pretty_env_logger.workspace = true
ron.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["full"] }
